name: Deploy Login Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # Go to project directory
            cd ~/Login-Portfolio

            # Get latest GitHub code
            git fetch origin main
            git reset --hard origin/main

            echo "Code updated"

            # Create .env automatically
            cat > .env <<EOF
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            EOF

            echo ".env created"

            # Stop old containers
            docker compose down

            # Build and start new containers
            docker compose up -d --build

            echo "Waiting for containers..."
            sleep 15

            # Show container status
            docker compose ps

            # Show PostgreSQL status
            echo "PostgreSQL health:"
            docker inspect login_postgres \
              --format='{{.State.Health.Status}}' || true

            # Show logs if PostgreSQL is unhealthy
            if [ "$(docker inspect login_postgres --format='{{.State.Health.Status}}' 2>/dev/null || echo unknown)" = "unhealthy" ]; then
              echo "PostgreSQL is unhealthy"
              docker compose logs postgres --tail 100
              exit 1
            fi

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"
```
